# Packages MoldyDrops and MoldyDrops_112 with the BigWigs packager (.pkgmeta)
# and publishes a GitHub release with the zip whenever a tag is pushed:
#   git tag -a v0.2.0 -m "MoldyDrops 0.2.0"
#   git push origin v0.2.0
# MoldyDrops_Community is released from its own repository.
# Uploads to CurseForge, WoWInterface or Wago happen too once their secrets
# and project IDs (## X-Curse-Project-ID etc. in MoldyDrops.toc) are set.
name: Package and release

on:
  push:
    tags:
      - "**"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release

    env:
      CF_API_KEY: ${{ secrets.CF_API_KEY }}
      WOWI_API_TOKEN: ${{ secrets.WOWI_API_TOKEN }}
      WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
      GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }} # provided by GitHub, nothing to add

    steps:
      - name: Check out (full history, for the changelog)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Package and release
        uses: BigWigsMods/packager@v2
